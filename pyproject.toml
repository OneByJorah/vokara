[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vokara"
version = "1.0.0"
description = "A self-hosted phone AI assistant — a real-time STT → LLM → TTS pipeline you can bolt onto FreeSWITCH, Asterisk, or your existing PBX."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "OneByJorah", email = "info@jorahone.com"}]
keywords = ["voip", "pbx", "freeswitch", "asterisk", "freepbx", "3cx", "phone", "call", "stt", "tts", "speech", "voice", "ai", "llm", "faster-whisper", "piper", "websocket", "self-hosted", "privacy", "phone-ai", "jorahone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "faster-whisper>=0.9",
    "piper-tts>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "litellm>=1.0"]
dev = ["pytest", "black", "flake8"]

[project.urls]
Homepage = "https://github.com/OneByJorah/vokara"
Repository = "https://github.com/OneByJorah/vokara"
Issues = "https://github.com/OneByJorah/vokara/issues"

[tool.setuptools.packages.find]
include = ["bot*"]
