<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Vokara">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a09"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#ffd54a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
  <circle cx="1130" cy="70" r="150" fill="#FFB300" opacity="0.06"/>
  <circle cx="150" cy="280" r="190" fill="#FFB300" opacity="0.05"/>
  <g opacity="0.12" stroke="#FFB300" stroke-width="1.5" fill="none">
    <circle cx="180" cy="160" r="26"/><line x1="206" y1="160" x2="320" y2="160"/>
    <circle cx="346" cy="160" r="34"/><line x1="380" y1="160" x2="494" y2="160"/>
    <circle cx="528" cy="160" r="42"/>
  </g>
  <text x="640" y="140" font-family="JetBrains Mono, ui-monospace, monospace" font-size="68" font-weight="800" fill="url(#accent)" text-anchor="middle" filter="url(#glow)">vokara</text>
  <text x="640" y="198" font-family="JetBrains Mono, ui-monospace, monospace" font-size="27" fill="#c7c2b4" text-anchor="middle">Self-hosted phone AI assistant</text>
  <text x="640" y="296" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="600" fill="#FFB300" opacity="0.85" letter-spacing="3" text-anchor="middle">ONEBYJORAH</text>
</svg>
